<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Macrobeat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0D0D0D;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }
    .logo {
      display: flex;
      gap: 5px;
      align-items: flex-end;
      margin-bottom: 32px;
    }
    .bar { width: 10px; border-radius: 4px; }
    .bar-p { height: 36px; background: #4CAF82; }
    .bar-c { height: 28px; background: #C9A84C; }
    .bar-f { height: 20px; background: #C0504D; }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: rgba(255,255,255,0.55);
      line-height: 1.5;
      max-width: 300px;
      margin-bottom: 40px;
    }
    .btn {
      display: inline-block;
      background: #fff;
      color: #0D0D0D;
      font-size: 16px;
      font-weight: 600;
      padding: 16px 32px;
      border-radius: 14px;
      text-decoration: none;
      letter-spacing: -0.2px;
    }
  </style>
</head>
<body>
  <div class="logo">
    <div class="bar bar-p"></div>
    <div class="bar bar-c"></div>
    <div class="bar bar-f"></div>
  </div>
  <h1>Macrobeat</h1>
  <p>Calorie &amp; macro tracking for iOS.</p>
  <a class="btn" href="https://apps.apple.com/app/macrobeat/id6744042588">Download on the App Store</a>
</body>
</html>
